name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - src/**
      - pyproject.toml
      - .github/workflows/container.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build local validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: worldos:validation
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container image
        run: |
          set -euo pipefail
          mkdir -p /tmp/worldos-data /tmp/worldos-backups
          chmod 0777 /tmp/worldos-data /tmp/worldos-backups
          docker run --rm \
            -v /tmp/worldos-data:/data \
            -v /tmp/worldos-backups:/backups \
            worldos:validation init
          docker run --rm \
            -v /tmp/worldos-data:/data \
            -v /tmp/worldos-backups:/backups \
            worldos:validation run --ticks 1
          docker run -d --name worldos-inspector \
            -p 127.0.0.1:18765:8765 \
            -v /tmp/worldos-data:/data \
            -v /tmp/worldos-backups:/backups \
            worldos:validation inspector
          trap 'docker rm -f worldos-inspector >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/ >/dev/null
          docker run --rm \
            -v /tmp/worldos-data:/data \
            -v /tmp/worldos-backups:/backups \
            worldos:validation backup
          test -n "$(find /tmp/worldos-backups -name 'world-*.db' -print -quit)"

      - name: Build and push multi-platform image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
