name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test CLI
        run: |
          worldos-core simulate --ticks 1 > /tmp/worldos-simulate.json
          worldos-core inspect traveler --ticks 1 > /tmp/worldos-inspect.json
          worldos-core narrate --actor witness --ticks 1 > /tmp/worldos-narrate.json
