name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log
          else
            python -m pytest -q -k 'not persistent_kernel_survives_ten_thousand_ticks' 2>&1 | tee pytest-${{ matrix.python-version }}.log
          fi

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

      - name: Smoke test CLI
        run: |
          worldos-core simulate --ticks 1 > /tmp/worldos-simulate.json
          worldos-core inspect traveler --ticks 1 > /tmp/worldos-inspect.json
          worldos-core narrate --actor witness --ticks 1 > /tmp/worldos-narrate.json
          worldos-living init --db /tmp/worldos-living.db
          worldos-living run --db /tmp/worldos-living.db --ticks 1 --restart-at 0 > /tmp/worldos-living.json
