name: worldos

x-worldos-common: &worldos-common
  image: ${WORLDOS_IMAGE:-ghcr.io/yet-tang/worldos:latest}
  user: "${WORLDOS_UID:-1000}:${WORLDOS_GID:-1000}"
  environment:
    WORLDOS_DB: /data/world.db
    WORLDOS_BACKUP_DIR: /backups
  volumes:
    - ${WORLDOS_DATA_DIR:-./data}:/data
    - ${WORLDOS_BACKUP_DIR:-./backups}:/backups
  restart: "no"

services:
  inspector:
    <<: *worldos-common
    command: ["inspector"]
    environment:
      WORLDOS_DB: /data/world.db
      WORLDOS_HOST: 0.0.0.0
      WORLDOS_PORT: 8765
      WORLDOS_AUTO_INIT: ${WORLDOS_AUTO_INIT:-false}
      WORLDOS_DEBUG_TOKEN: ${WORLDOS_DEBUG_TOKEN:-}
      WORLDOS_CONTROL_TOKEN: ${WORLDOS_CONTROL_TOKEN:-}
    expose:
      - "8765"
    networks:
      - worldos-internal
    restart: unless-stopped

  mcp:
    <<: *worldos-common
    command: ["mcp"]
    environment:
      WORLDOS_DB: /data/world.db
      WORLDOS_MCP_HOST: 0.0.0.0
      WORLDOS_MCP_PORT: 8766
      WORLDOS_MCP_TOKEN: ${WORLDOS_MCP_TOKEN:-}
      WORLDOS_MCP_PUBLIC_URL: ${WORLDOS_MCP_PUBLIC_URL:-https://worldos.255202.xyz/mcp}
      WORLDOS_MCP_ISSUER_URL: ${WORLDOS_MCP_ISSUER_URL:-https://worldos.255202.xyz/auth}
      WORLDOS_CONTROL_TOKEN: ${WORLDOS_CONTROL_TOKEN:-}
      WORLDOS_CONTROL_INTERNAL_URL: ${WORLDOS_CONTROL_INTERNAL_URL:-http://inspector:8765/api/control}
    expose:
      - "8766"
    networks:
      - worldos-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8766),3); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      inspector:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "${WORLDOS_HTTP_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WORLDOS_HTPASSWD_FILE:-./secrets/htpasswd}:/etc/nginx/htpasswd:ro
    networks:
      - worldos-internal
    restart: unless-stopped

  init:
    <<: *worldos-common
    command: ["init"]
    profiles: ["admin"]

  run:
    <<: *worldos-common
    command: ["run", "--ticks", "${WORLDOS_RUN_TICKS:-100}"]
    profiles: ["admin"]

  backup:
    <<: *worldos-common
    command: ["backup"]
    profiles: ["admin"]

networks:
  worldos-internal:
    internal: true
