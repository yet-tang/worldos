[project]
name = "worldos-core"
version = "0.1.0"
description = "Event-sourced deterministic kernel for WorldOS."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
worldos-core = "worldos_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
